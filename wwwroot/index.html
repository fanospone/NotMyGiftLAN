<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOT MY GIFT! | LAN Party</title><link rel="stylesheet" href="/css/site.css"></head><body>
<header><div class="brand">🎁 NOT MY GIFT! <span>LAN PARTY</span></div><div id="status" class="pill">Menghubungkan...</div></header>
<main>
<section id="home" class="panel"><h1>Hadiah siapa ini? 🤫</h1><p>Ingat barangnya, teruskan hadiah, dan jangan sampai ketahuan bluffing!</p><label>Nama pemain<input id="name" maxlength="20" placeholder="Nama kamu" autocomplete="nickname"></label><div class="actions"><button id="create">✨ Buat Room</button></div><div class="separator">ATAU JOIN ROOM</div><label>Kode room<input id="joinCode" maxlength="6" placeholder="Contoh: ABC123" style="text-transform:uppercase"></label><button id="join" class="secondary">🚪 Gabung Room</button></section>
<section id="game" hidden><div class="roomtop"><div><small>KODE ROOM</small><h2 id="roomCode"></h2></div><button class="secondary" id="copy">📋 Salin Kode</button></div><div class="layout"><div class="left"><div class="panel"><h3>👥 Pemain</h3><div id="players" class="players"></div></div><div class="panel"><h3>📜 Aktivitas</h3><div id="logs" class="logs"></div></div></div><div class="right"><div class="panel center"><div id="phase" class="phase"></div><h2 id="headline"></h2><p id="description"></p><div id="cards" class="cards"></div><div id="controls" class="controls"></div></div><div class="tip">💡 Kartu asli disimpan di server. Setelah fase hafalan, pemain tidak dapat melihatnya lagi.</div></div></div></section>
</main><div id="toast" class="toast" hidden></div><script src="/lib/signalr.min.js" crossorigin="anonymous" onerror="window.signalrLoadFailed=true"></script><script src="/js/game.js"></script></body></html>
